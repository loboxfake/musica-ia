name: Verify Android ExecuTorch native build

on:
  workflow_dispatch:
  push:
    branches:
      - ruta-a-compile
    paths:
      - app/src/main/cpp/**
      - app/build.gradle.kts
      - .github/workflows/native-compile.yml

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android CMake and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.6" "ndk;27.2.12479018"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
      - name: Build APK with ExecuTorch native runtime
        run: |
          gradle assembleDebug -PwithAudioNative=true 2>&1 | tee native-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== NATIVE BUILD FAILED ==="
            grep -E "error:|CMake Error|FAILED|What went wrong" native-build.log | tail -100 || true
            exit 1
          fi
      - name: Upload native test APK
        uses: actions/upload-artifact@v4
        with:
          name: musicaia-native-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
