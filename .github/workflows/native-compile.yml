name: Verify Android ExecuTorch native build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/src/main/cpp/**
      - app/build.gradle.kts
      - .github/workflows/native-compile.yml

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android CMake and NDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.6" "ndk;27.2.12479018"
      - name: Install pinned PyTorch headers for ExecuTorch CMake
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.0
          python3 -c "import torch; print('PyTorch', torch.__version__, torch.__file__)"
      - name: Checkout pinned ExecuTorch source
        run: |
          git clone --no-checkout https://github.com/pytorch/executorch.git "$RUNNER_TEMP/executorch"
          git -C "$RUNNER_TEMP/executorch" checkout 8c84780911e7f4e9eb19395181b04761392a4b56
          git -C "$RUNNER_TEMP/executorch" submodule update --init --recursive
          test "$(git -C "$RUNNER_TEMP/executorch" rev-parse HEAD)" = "8c84780911e7f4e9eb19395181b04761392a4b56"
      - name: Build APK with ExecuTorch native runtime
        run: |
          ./gradlew assembleDebug -PwithAudioNative=true -PetSrcPath="$RUNNER_TEMP/executorch" 2>&1 | tee native-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== NATIVE BUILD FAILED ==="
            grep -E "error:|CMake Error|FAILED|What went wrong" native-build.log | tail -100 || true
            exit 1
          fi
      - name: Upload native test APK
        uses: actions/upload-artifact@v4
        with:
          name: musicaia-native-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
