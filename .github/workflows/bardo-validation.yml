name: BARDO integration validation

on:
  # All integrated development and validation runs directly from main.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bardo-validation-${{ github.event.pull_request.head.sha || github.sha }}
  # Las validaciones completas no deben cancelarse por un push posterior.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go for Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Scan complete Git history with redacted findings
        env:
          GITLEAKS_ENABLE_SUMMARY: 'false'
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --redact --exit-code 1 --no-banner
      - name: Lint all GitHub Actions workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/*.yml
      - name: Run unit tests and compile Xiaomi ARM64 debug APK
        run: ./gradlew testDebugUnitTest assembleDebug -PbardoTargetAbi=arm64-v8a --no-daemon --stacktrace
      - name: Verify candidate APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK v2 signature and Android Debug certificate
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" | tee bardo-debug-signature.txt
          grep -Eiq 'Verified using v2 scheme.*true' bardo-debug-signature.txt
          grep -Eiq 'certificate DN: .*CN=Android Debug' bardo-debug-signature.txt
      - name: Verify APK contains only ARM64 native libraries
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          with ZipFile(apk) as archive:
              native = [
                  name for name in archive.namelist()
                  if name.startswith("lib/") and name.endswith(".so")
              ]
          if not native:
              raise SystemExit("El APK no contiene bibliotecas nativas.")
          wrong = [name for name in native if not name.startswith("lib/arm64-v8a/")]
          if wrong:
              raise SystemExit("El APK contiene ABI no autorizadas: " + ", ".join(wrong[:20]))
          print(f"ABI verificada: arm64-v8a; bibliotecas nativas: {len(native)}")
          PY
      - name: Upload Xiaomi ARM64 debug candidate (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: bardo-debug-arm64-candidate-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
