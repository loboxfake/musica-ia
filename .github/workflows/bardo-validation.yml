name: BARDO integration validation

on:
  push:
    branches:
      - bardo-unified-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bardo-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
          cache-disabled: true
      - name: Run unit tests and compile debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
