name: BARDO integration validation

on:
  push:
    branches:
      - main
      - 'bardo/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bardo-validation-${{ github.ref }}
  # Las validaciones completas no deben cancelarse por un push posterior.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go for Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Scan complete Git history with redacted findings
        env:
          GITLEAKS_ENABLE_SUMMARY: 'false'
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --redact --exit-code 1 --no-banner
      - name: Lint all GitHub Actions workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/*.yml
      - name: Run unit tests and compile debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Verify candidate APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload branch validation APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: bardo-debug-candidate-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
