name: BARDO unified offline APK candidate

on:
  push:
    branches:
      - bardo/integral-autonomy-20261109
    paths:
      - .github/workflows/**
      - app/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradle.properties
      - tools/**
      - catalogo/**
      - docs/**
      - README.md
      - ESPECIFICACION.md
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: bardo-unified-offline-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-unified-candidate:
    if: github.ref == 'refs/heads/bardo/integral-autonomy-20261109'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go for Gitleaks and actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Scan complete Git history
        env:
          GITLEAKS_ENABLE_SUMMARY: 'false'
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --redact --exit-code 1 --no-banner

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/*.yml

      - name: Prepare launcher resources
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/generate_launcher_mipmaps.py

      - name: Package BARDO source snapshot
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          git archive --format=zip --output="$RUNNER_TEMP/bardo-source-snapshot.zip" HEAD \
            app/src/main app/src/test app/build.gradle.kts build.gradle.kts settings.gradle.kts \
            gradle.properties gradle/wrapper .github/workflows catalogo tools docs \
            ESPECIFICACION.md README.md
          test -s "$RUNNER_TEMP/bardo-source-snapshot.zip"
          python3 - "$RUNNER_TEMP/bardo-source-snapshot.zip" "$GITHUB_SHA" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], "a", compression=zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("BARDO_SOURCE_COMMIT.txt", sys.argv[2] + chr(10))
          PY
          unzip -l "$RUNNER_TEMP/bardo-source-snapshot.zip" | grep -q 'BARDO_SOURCE_COMMIT.txt'
          unzip -l "$RUNNER_TEMP/bardo-source-snapshot.zip" | grep -q 'app/src/test/'
          unzip -l "$RUNNER_TEMP/bardo-source-snapshot.zip" | grep -q 'ESPECIFICACION.md'
          unzip -l "$RUNNER_TEMP/bardo-source-snapshot.zip" | grep -q 'docs/BARDO_EVOLUTION_ARCHITECTURE.md'
          python3 - "$RUNNER_TEMP/bardo-source-snapshot.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = [item for item in archive.infolist() if not item.is_dir()]
              total = sum(item.file_size for item in entries)
              oversized = [item.filename for item in entries if item.file_size > 2 * 1024 * 1024]
              if len(entries) > 3000 or total > 60 * 1024 * 1024 or oversized:
                  raise SystemExit(f"BARDO_SNAPSHOT_EXCEEDS_IMPORT_LIMITS: files={len(entries)} bytes={total} oversized={oversized[:5]}")
              print(f"BARDO_SOURCE_SNAPSHOT_IMPORTABLE: files={len(entries)} uncompressed_bytes={total}")
          PY
          cp "$RUNNER_TEMP/bardo-source-snapshot.zip" app/src/main/assets/bardo_source_snapshot.zip

      - name: Download and verify the pinned Stable Audio Open Small export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="stable-audio-open-small-executorch"
          export_run_id="42700052867"
          export_head_sha="b0c9fc6998594b2f58cd8392dd65d8d4a593d4bb"
          artifact_id="13713725273"
          expected_digest="sha256:c0e6773df66ceedca06dc694239a79ad559ff372a3193e05e063f9a6d11d9c1a"
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
          test "$(printf '%s' "$metadata" | jq -r '.name')" = "$artifact_name"
          test "$(printf '%s' "$metadata" | jq -r '.expired')" = "false"
          test "$(printf '%s' "$metadata" | jq -r '.digest')" = "$expected_digest"
          test "$(printf '%s' "$metadata" | jq -r '.workflow_run.id')" = "$export_run_id"
          test "$(printf '%s' "$metadata" | jq -r '.workflow_run.head_sha')" = "$export_head_sha"
          run_info="$(gh run view "$export_run_id" --json status,conclusion,headSha)"
          test "$(printf '%s' "$run_info" | jq -r '.status')" = "completed"
          test "$(printf '%s' "$run_info" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$run_info" | jq -r '.headSha')" = "$export_head_sha"
          mkdir -p app/src/main/assets/audio_model
          gh run download "$export_run_id" --name "$artifact_name" --dir app/src/main/assets/audio_model
          for file in conditioners_model.pte dit_model.pte autoencoder_model.pte spiece.model LICENSE model_config.json; do
            test -s "app/src/main/assets/audio_model/$file"
          done
          test -s app/src/main/assets/NOTICE.txt
          grep -qi "Powered by Stability AI" README.md
          python3 - app/src/main/assets/audio_model <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{path.name}\t{path.stat().st_size}\t{digest}")
          pathlib.Path("stable-audio-model-manifest.tsv").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install pinned Android CMake and NDK
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Run unit tests
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Install pinned PyTorch headers for ExecuTorch CMake
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.0
          python3 -c "import torch; print('PyTorch', torch.__version__, torch.__file__)"

      - name: Checkout pinned ExecuTorch source
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/pytorch/executorch.git "$RUNNER_TEMP/executorch"
          git -C "$RUNNER_TEMP/executorch" checkout 8c84780911e7f4e9eb19395181b04761392a4b56
          git -C "$RUNNER_TEMP/executorch" submodule update --init --recursive --jobs 6 \
            backends/xnnpack/third-party/FP16 \
            backends/xnnpack/third-party/FXdiv \
            backends/xnnpack/third-party/XNNPACK \
            backends/xnnpack/third-party/cpuinfo \
            backends/xnnpack/third-party/pthreadpool \
            extension/llm/tokenizers \
            kernels/optimized/third-party/eigen \
            third-party/flatbuffers \
            third-party/flatcc \
            third-party/gflags \
            third-party/json \
            third-party/pocketfft
          test "$(git -C "$RUNNER_TEMP/executorch" rev-parse HEAD)" = "8c84780911e7f4e9eb19395181b04761392a4b56"

      - name: Build complete offline ARM64 debug APK
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest assembleDebug \
            -PwithAudioNative=true \
            -PbardoTargetAbi=arm64-v8a \
            -PbardoVersionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PetSrcPath="$RUNNER_TEMP/executorch" \
            --no-daemon --stacktrace 2>&1 | tee unified-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify full model pack, JNI libraries, APK integrity and Debug signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" | tee unified-signature.txt
          grep -Eiq 'Verified using v2 scheme.*true' unified-signature.txt
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" | tee -a unified-signature.txt
          grep -Eiq 'certificate DN: .*CN=Android Debug' unified-signature.txt
          python3 - "$APK" <<'PY'
          import hashlib, pathlib, sys, zipfile
          apk = pathlib.Path(sys.argv[1])
          required = [
              "assets/audio_model/conditioners_model.pte",
              "assets/audio_model/dit_model.pte",
              "assets/audio_model/autoencoder_model.pte",
              "assets/audio_model/spiece.model",
              "assets/audio_model/LICENSE",
              "assets/audio_model/model_config.json",
              "assets/NOTICE.txt",
              "assets/bardo_source_snapshot.zip",
              "lib/arm64-v8a/libaudiogen.so",
              "lib/arm64-v8a/libmp3encoder.so",
              "lib/arm64-v8a/libmp3lame.so",
          ]
          digest = hashlib.sha256()
          with apk.open("rb") as stream:
              for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          report = [
              f"APK: {apk.name}",
              f"APK_BYTES: {apk.stat().st_size}",
              f"APK_SHA256: {digest.hexdigest()}",
          ]
          with zipfile.ZipFile(apk) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"APK_ZIP_CORRUPT_ENTRY: {bad}")
              names = set(archive.namelist())
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("APK_MISSING_REQUIRED_ENTRIES: " + ", ".join(missing))
              native = [name for name in names if name.startswith("lib/") and name.endswith(".so")]
              wrong_abi = [name for name in native if not name.startswith("lib/arm64-v8a/")]
              if wrong_abi:
                  raise SystemExit("APK_HAS_NON_ARM64_LIBRARIES: " + ", ".join(sorted(wrong_abi)))
              for name in required:
                  info = archive.getinfo(name)
                  if info.file_size <= 0:
                      raise SystemExit(f"APK_EMPTY_ENTRY: {name}")
                  if name.endswith((".pte", ".model")) and info.compress_type != zipfile.ZIP_STORED:
                      raise SystemExit(f"MODEL_ASSET_NOT_STORED: {name}")
                  report.append(f"ENTRY_OK: {name} ({info.file_size} bytes)")
              if len(native) < 3:
                  raise SystemExit(f"APK_NATIVE_LIBRARIES_INCOMPLETE: {len(native)}")
              report.append(f"NATIVE_LIBRARIES_ARM64: {len(native)}")
          pathlib.Path("unified-apk-audit.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY
          "$AAPT" dump badging "$APK" | tee unified-badging.txt
          grep -q "package: name='com.musicaia.debug'" unified-badging.txt
          grep -q "sdkVersion:'26'" unified-badging.txt
          grep -q "targetSdkVersion:'34'" unified-badging.txt
          grep -q "application-debuggable" unified-badging.txt
          python3 tools/audit_apk_secrets.py "$APK"
          {
            sha256sum "$APK"
            cat stable-audio-model-manifest.tsv
            cat unified-signature.txt
            cat unified-badging.txt
          } >> unified-apk-audit.txt

      - name: Upload single unified ARM64 APK candidate (Debug-signed; no release key)
        uses: actions/upload-artifact@v4
        with:
          name: bardo-unified-offline-arm64-candidate-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            unified-apk-audit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Report unified APK candidate status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "BARDO / unified offline APK candidate",
              description: state === "success"
                ? "Stable Audio assets, ExecuTorch ARM64 JNI, unit tests and APK audit passed"
                : "Unified offline APK build or audit failed"
            });
