name: Build APK

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
      - name: Unit tests
        run: |
          gradle testDebugUnitTest 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== ERROR EN UNIT TESTS ==="
            grep -E "FAILED|Exception|error:" test.log || true
            exit 1
          fi
      - name: Build (gradle sin wrapper)
        run: |
          gradle assembleDebug -PbardoVersionCode="$GITHUB_RUN_NUMBER" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== ERROR EN BUILD ==="
            echo "--- lineas con error ---"
            grep "^e: " build.log || true
            grep -B 8 -A 30 "What went wrong" build.log || true
            exit 1
          fi
      - name: Generate APK audit
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
          ls -lh "$APK" | tee app-debug.apk.size.txt
      - name: Publish installable APK release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bardo-build-${{ github.run_number }}
          name: BARDO build ${{ github.run_number }}
          body: |
            APK compilada y probada con Gradle y pruebas unitarias.
            Revisa app-debug.apk.sha256 para verificar integridad.
            Esta publicación no sustituye la prueba física de reproducción en el teléfono.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            app-debug.apk.size.txt
          fail_on_unmatched_files: true
