name: Build APK

# CI trigger refresh: validate tests and APK packaging independently.

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mark lightweight validation pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: "pending", context: "BARDO / tests + APK compilation", description: "Unit tests and lightweight APK compilation queued" });
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
          cache-disabled: true
      - name: Generate Digital Bardic Quill mipmaps
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/generate_launcher_mipmaps.py
      - name: Unit tests
        run: |
          gradle testDebugUnitTest 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== ERROR EN UNIT TESTS ==="
            grep -E "FAILED|Exception|error:" test.log || true
            exit 1
          fi
      - name: Build (gradle sin wrapper)
        run: |
          gradle assembleDebug -PbardoVersionCode="$GITHUB_RUN_NUMBER" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== ERROR EN BUILD ==="
            echo "--- lineas con error ---"
            grep "^e: " build.log || true
            grep -B 8 -A 30 "What went wrong" build.log || true
            exit 1
          fi
      - name: Generate APK audit
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
          ls -lh "$APK" | tee app-debug.apk.size.txt
      - name: Report tests and APK compilation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "BARDO / tests + APK compilation",
              description: state === "success" ? "Unit tests and APK compilation passed" : "Unit tests or APK compilation failed"
            });
