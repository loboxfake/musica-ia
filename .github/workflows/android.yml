name: Build APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
          cache-disabled: true
      - name: Generate launcher assets
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/generate_launcher_mipmaps.py
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
