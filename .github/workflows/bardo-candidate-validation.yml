name: BARDO candidate validation

run-name: BARDO candidate validation · ${{ inputs.candidate_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Unique BARDO candidate identifier
        required: true
        type: string
      base_sha:
        description: Exact main commit used to create the candidate
        required: true
        type: string
      patch_gzip_b64:
        description: Gzip-compressed unified diff, Base64 encoded
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bardo-candidate-${{ inputs.candidate_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact main snapshot without persisting credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm candidate base is still the main tip
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::Invalid base SHA."
            exit 1
          fi
          # Authenticated read: works for both public and private repositories.
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current_main" = "$BASE_SHA" || {
            echo "::error::Candidate is stale. Refresh BARDO source snapshot from latest main."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - name: Capture immutable workflow guards and protected-path policy from the exact base
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          git show "$BASE_SHA:app/src/main/java/com/musicaia/desarrollo/BardoProtectedPathPolicy.kt" > "$RUNNER_TEMP/bardo-protected-path-policy.kt"
          git show "$BASE_SHA:.github/scripts/bardo_workflow_guards.py" > "$RUNNER_TEMP/bardo-workflow-guards.py"
          test -s "$RUNNER_TEMP/bardo-protected-path-policy.kt"
          test -s "$RUNNER_TEMP/bardo-workflow-guards.py"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode and safely apply BARDO candidate
        env:
          PATCH_GZIP_B64: ${{ inputs.patch_gzip_b64 }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bardo-candidate"
          python3 "$RUNNER_TEMP/bardo-workflow-guards.py" decode "$RUNNER_TEMP/bardo-candidate/change.patch"
          git apply --check "$RUNNER_TEMP/bardo-candidate/change.patch"
          git apply "$RUNNER_TEMP/bardo-candidate/change.patch"
          python3 "$RUNNER_TEMP/bardo-workflow-guards.py" check-paths \
            --policy "$RUNNER_TEMP/bardo-protected-path-policy.kt" \
            --report candidate-validation-changed-files.txt
          git diff --check

      - name: Set up Go for Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Scan the exact candidate commit for secrets before validation
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          mapfile -t changed < candidate-validation-changed-files.txt
          git config user.name "BARDO Candidate Validation"
          git config user.email "bardo-candidate-validation@users.noreply.github.com"
          git add -- "${changed[@]}"
          git diff --cached --check
          git commit -m "BARDO isolated candidate validation $CANDIDATE_ID"
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --redact --exit-code 1 --no-banner

      - name: Run unit tests and compile candidate debug APK
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/bardo-candidate-tests.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "FAILED|Exception|error:|What went wrong" "$RUNNER_TEMP/bardo-candidate-tests.log" | tail -100 || true
            exit "$status"
          fi

      - name: Create candidate validation report
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          {
            echo "BARDO CANDIDATE VALIDATION"
            echo "Candidate: $CANDIDATE_ID"
            echo "Base commit: $BASE_SHA"
            echo "Result: SUCCESS"
            echo "The candidate was applied only to this ephemeral runner."
            echo "No Git branch or repository file was changed."
            echo
            echo "Changed files:"
            cat candidate-validation-changed-files.txt
          } > candidate-validation-report.txt
          patch_sha256="$(sha256sum "$RUNNER_TEMP/bardo-candidate/change.patch" | awk '{print $1}')"
          echo "Patch SHA-256: $patch_sha256" >> candidate-validation-report.txt

      - name: Publish candidate validation report
        uses: actions/upload-artifact@v4
        with:
          name: bardo-candidate-validation-${{ inputs.candidate_id }}
          path: candidate-validation-report.txt
          if-no-files-found: error
          retention-days: 14
