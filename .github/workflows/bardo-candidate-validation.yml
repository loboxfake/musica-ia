name: BARDO candidate validation

run-name: BARDO candidate validation · ${{ inputs.candidate_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Unique BARDO candidate identifier
        required: true
        type: string
      base_sha:
        description: Exact main commit used to create the candidate
        required: true
        type: string
      patch_gzip_b64:
        description: Gzip-compressed unified diff, Base64 encoded
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bardo-candidate-${{ inputs.candidate_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact main snapshot without persisting credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm candidate base is still the main tip
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::Invalid base SHA."
            exit 1
          fi
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$BASE_SHA" || {
            echo "::error::Candidate is stale. Refresh BARDO's source snapshot from the latest main."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode and safely apply BARDO candidate
        env:
          PATCH_GZIP_B64: ${{ inputs.patch_gzip_b64 }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bardo-candidate"
          python3 - "$RUNNER_TEMP/bardo-candidate/change.patch" <<'PY'
          import base64, gzip, os, pathlib, re, sys
          candidate = os.environ["CANDIDATE_ID"]
          if not re.fullmatch(r"[0-9a-f]{32}", candidate):
              raise SystemExit("BARDO_CANDIDATE_ID_INVALID")
          packed = base64.b64decode(os.environ["PATCH_GZIP_B64"], validate=True)
          patch = gzip.decompress(packed)
          if not patch or len(patch) > 384 * 1024:
              raise SystemExit("BARDO_PATCH_SIZE_INVALID")
          pathlib.Path(sys.argv[1]).write_bytes(patch)
          print(f"Candidate {candidate}; patch bytes={len(patch)}")
          PY
          git apply --check "$RUNNER_TEMP/bardo-candidate/change.patch"
          git apply "$RUNNER_TEMP/bardo-candidate/change.patch"
          python3 - <<'PY'
          import subprocess
          allowed = ("app/src/main/java/", "app/src/main/res/", "docs/")
          protected = {
              "app/src/main/java/com/musicaia/MainActivity.kt",
              "app/src/main/java/com/musicaia/BardoDeveloperActivity.kt",
              "app/src/main/java/com/musicaia/BardoGitHubDevelopmentActivity.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoDeveloperCore.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoDeveloperWorker.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoPatchApplier.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoProtectedPathPolicy.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoWorkspaceManager.kt",
              "app/src/main/java/com/musicaia/seguridad/BardoAuthorityPolicy.kt",
              "app/src/main/java/com/musicaia/seguridad/BardoAuthorityLedger.kt",
              "app/src/main/java/com/musicaia/modelos/BardoModelProvider.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillManifest.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillManager.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillExecutor.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillToolHandler.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillWorkflowExecutor.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillWorkflowPackageValidator.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillArchiveReader.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillWorkflowToolHandler.kt",
              "app/src/main/java/com/musicaia/skills/BardoCoreSkillSmokeTestRunner.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillMaintenancePlanner.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillDraftBuilder.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillDraftToolHandler.kt",
              "app/src/main/java/com/musicaia/skills/BardoSkillActivationGate.kt",
              "app/src/main/java/com/musicaia/storage/BardoMobileFilePolicy.kt",
              "app/src/main/java/com/musicaia/storage/BardoSharedStorage.kt",
              "app/src/main/java/com/musicaia/storage/BardoExportSourcePolicy.kt",
              "app/src/main/java/com/musicaia/modelo/BardoModuleCatalog.kt",
              "app/src/main/java/com/musicaia/modulos/DescargadorModelos.kt",
              "app/src/main/java/com/musicaia/servicios/BardoTaskService.kt",
              "app/src/main/java/com/musicaia/memoria/BardoActivityStore.kt",
              "app/src/main/java/com/musicaia/memoria/BardoBackupManager.kt",
              "app/src/main/java/com/musicaia/memoria/BardoKnowledgeStore.kt",
              "app/src/main/java/com/musicaia/memoria/BardoConversationStore.kt",
              "app/src/main/java/com/musicaia/herramientas/BardoToolExecutor.kt",
              "app/src/main/java/com/musicaia/herramientas/BardoCoreToolCatalog.kt",
              "app/src/main/java/com/musicaia/autonomia/BardoAutonomyEngine.kt",
              "app/src/main/java/com/musicaia/evaluacion/BardoIndependentEvaluator.kt",
              "app/src/main/java/com/musicaia/evaluacion/BardoLocalCandidateEvidenceCollector.kt",
              "app/src/main/java/com/musicaia/evaluacion/BardoCiEvidenceAdapter.kt",
              "app/src/main/java/com/musicaia/modelo/BardoCapabilityRegistry.kt",
              "app/src/main/java/com/musicaia/diagnostico/BardoSelfInventory.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoGitHubAutomation.kt",
              "app/src/main/java/com/musicaia/modelo/BardoCapabilityRegistry.kt",
              "app/src/main/java/com/musicaia/modelo/BardoIntentRouter.kt",
              "app/src/main/java/com/musicaia/modelo/BardoResourceBudget.kt",
              "app/src/main/java/com/musicaia/modelo/Orquestador.kt",
              "app/src/main/java/com/musicaia/modelo/Catalogo.kt",
              "app/src/main/java/com/musicaia/modelo/ManifiestoModelo.kt",
              "app/src/main/java/com/musicaia/modulos/litert/EngineLiteRT.kt",
              "app/src/main/java/com/musicaia/modulos/litert/LiteRTLMModule.kt",
          }
          rows = subprocess.check_output(["git", "diff", "--name-status"], text=True).splitlines()
          if not rows:
              raise SystemExit("BARDO_PATCH_EMPTY")
          changed = []
          for row in rows:
              status, path = row.split("\t", 1)
              if status != "M":
                  raise SystemExit(f"BARDO_PATCH_MUST_MODIFY_EXISTING_FILES: {status} {path}")
              if path not in allowed and not path.startswith(allowed):
                  raise SystemExit(f"BARDO_PATH_OUTSIDE_ALLOWLIST: {path}")
              if path in protected or path.endswith("Modo3MezclaVozUsuario.kt") or path.startswith((".github/", "gradle/")):
                  raise SystemExit(f"BARDO_PROTECTED_PATH: {path}")
              if ".." in path.split("/") or path.startswith("/"):
                  raise SystemExit(f"BARDO_UNSAFE_PATH: {path}")
              changed.append(path)
          if len(changed) > 30:
              raise SystemExit("BARDO_TOO_MANY_CHANGED_FILES")
          pathlib = __import__("pathlib")
          pathlib.Path("candidate-validation-changed-files.txt").write_text("\n".join(changed) + "\n")
          print("Candidate paths accepted:")
          print("\n".join(changed))
          PY
          git diff --check

      - name: Run unit tests and compile candidate debug APK
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/bardo-candidate-tests.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "FAILED|Exception|error:|What went wrong" "$RUNNER_TEMP/bardo-candidate-tests.log" | tail -100 || true
            exit "$status"
          fi

      - name: Create candidate validation report
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          {
            echo "BARDO CANDIDATE VALIDATION"
            echo "Candidate: $CANDIDATE_ID"
            echo "Base commit: $BASE_SHA"
            echo "Result: SUCCESS"
            echo "The candidate was applied only to this ephemeral runner."
            echo "No Git branch or repository file was changed."
            echo
            echo "Changed files:"
            cat candidate-validation-changed-files.txt
          } > candidate-validation-report.txt
          patch_sha256="$(sha256sum "$RUNNER_TEMP/bardo-candidate/change.patch" | awk '{print $1}')"
          echo "Patch SHA-256: $patch_sha256" >> candidate-validation-report.txt

      - name: Publish candidate validation report
        uses: actions/upload-artifact@v4
        with:
          name: bardo-candidate-validation-${{ inputs.candidate_id }}
          path: candidate-validation-report.txt
          if-no-files-found: error
          retention-days: 14
