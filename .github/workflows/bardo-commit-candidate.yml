name: BARDO approved candidate PR preparation

run-name: BARDO approved PR preparation · ${{ inputs.candidate_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Candidate identifier previously validated successfully
        required: true
        type: string
      base_sha:
        description: Exact main commit used to create and validate the candidate
        required: true
        type: string
      patch_gzip_b64:
        description: Gzip-compressed unified diff, Base64 encoded
        required: true
        type: string
      validation_run_id:
        description: Successful candidate validation run ID
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: bardo-pr-candidate-${{ inputs.candidate_id }}
  cancel-in-progress: false

jobs:
  prepare-pr:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Verify the separately completed candidate validation
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VALIDATION_RUN_ID" | grep -Eq '^[0-9]{6,20}$'; then
            echo "::error::Invalid validation run ID."
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::Invalid candidate ID."
            exit 1
          fi
          if ! printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::Invalid base SHA."
            exit 1
          fi
          validation="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID")"
          test "$(jq -r '.path' <<< "$validation")" = ".github/workflows/bardo-candidate-validation.yml"
          test "$(jq -r '.event' <<< "$validation")" = "workflow_dispatch"
          test "$(jq -r '.head_branch' <<< "$validation")" = "main"
          test "$(jq -r '.status' <<< "$validation")" = "completed"
          test "$(jq -r '.conclusion' <<< "$validation")" = "success"
          test "$(jq -r '.head_sha' <<< "$validation")" = "$BASE_SHA"
          test "$(jq -r '.display_title' <<< "$validation")" = "BARDO candidate validation · $CANDIDATE_ID"

      - name: Retrieve immutable report from successful validation
        uses: actions/download-artifact@v4
        with:
          name: bardo-candidate-validation-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/bardo-validation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.validation_run_id }}

      - name: Checkout the exact main snapshot without persisting credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse stale candidates
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "::error::main moved after validation; candidate PR preparation refused."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reapply exact candidate and enforce protected paths
        env:
          PATCH_GZIP_B64: ${{ inputs.patch_gzip_b64 }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/bardo-approved.patch" <<'PY'
          import base64, gzip, os, pathlib, re, sys
          if not re.fullmatch(r"[0-9a-f]{32}", os.environ["CANDIDATE_ID"]):
              raise SystemExit("BARDO_CANDIDATE_ID_INVALID")
          patch = gzip.decompress(base64.b64decode(os.environ["PATCH_GZIP_B64"], validate=True))
          if not patch or len(patch) > 384 * 1024:
              raise SystemExit("BARDO_PATCH_SIZE_INVALID")
          pathlib.Path(sys.argv[1]).write_bytes(patch)
          PY
          expected_patch_sha256="$(sed -nE 's/^Patch SHA-256: ([0-9a-f]{64})$/\1/p' "$RUNNER_TEMP/bardo-validation/candidate-validation-report.txt")"
          actual_patch_sha256="$(sha256sum "$RUNNER_TEMP/bardo-approved.patch" | awk '{print $1}')"
          test -n "$expected_patch_sha256"
          test "$actual_patch_sha256" = "$expected_patch_sha256" || {
            echo "::error::Candidate differs from the patch that passed validation."
            exit 1
          }
          git apply --check "$RUNNER_TEMP/bardo-approved.patch"
          git apply "$RUNNER_TEMP/bardo-approved.patch"
          python3 - <<'PY'
          import subprocess
          allowed = ("app/src/main/java/", "app/src/main/res/", "docs/")
          protected = {
              "app/src/main/java/com/musicaia/MainActivity.kt",
              "app/src/main/java/com/musicaia/BardoDeveloperActivity.kt",
              "app/src/main/java/com/musicaia/BardoGitHubDevelopmentActivity.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoDeveloperCore.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoDeveloperWorker.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoPatchApplier.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoProtectedPathPolicy.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoWorkspaceManager.kt",
              "app/src/main/java/com/musicaia/desarrollo/BardoGitHubAutomation.kt",
              "app/src/main/java/com/musicaia/modelo/BardoCapabilityRegistry.kt",
              "app/src/main/java/com/musicaia/modelo/BardoIntentRouter.kt",
              "app/src/main/java/com/musicaia/modelo/BardoResourceBudget.kt",
              "app/src/main/java/com/musicaia/modelo/Orquestador.kt",
              "app/src/main/java/com/musicaia/modelo/Catalogo.kt",
              "app/src/main/java/com/musicaia/modelo/ManifiestoModelo.kt",
              "app/src/main/java/com/musicaia/modulos/litert/EngineLiteRT.kt",
              "app/src/main/java/com/musicaia/modulos/litert/LiteRTLMModule.kt",
          }
          rows = subprocess.check_output(["git", "diff", "--name-status"], text=True).splitlines()
          if not rows:
              raise SystemExit("BARDO_PATCH_EMPTY")
          changed = []
          for row in rows:
              status, path = row.split("\t", 1)
              if status != "M":
                  raise SystemExit(f"BARDO_PATCH_MUST_MODIFY_EXISTING_FILES: {status} {path}")
              if path not in allowed and not path.startswith(allowed):
                  raise SystemExit(f"BARDO_PATH_OUTSIDE_ALLOWLIST: {path}")
              if path in protected or path.endswith("Modo3MezclaVozUsuario.kt") or path.startswith((".github/", "gradle/")):
                  raise SystemExit(f"BARDO_PROTECTED_PATH: {path}")
              if ".." in path.split("/") or path.startswith("/"):
                  raise SystemExit(f"BARDO_UNSAFE_PATH: {path}")
              changed.append(path)
          if len(changed) > 30:
              raise SystemExit("BARDO_TOO_MANY_CHANGED_FILES")
          pathlib = __import__("pathlib")
          pathlib.Path("candidate-validation-changed-files.txt").write_text("\n".join(changed) + "\n")
          print("Candidate paths accepted:")
          print("\n".join(changed))
          PY
          git diff --check

      - name: Run the complete debug test suite again before opening the PR
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Create isolated bardo branch and draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          branch="bardo/$CANDIDATE_ID"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Candidate branch already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "BARDO: propose candidate $CANDIDATE_ID"
          candidate_sha="$(git rev-parse HEAD)"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"

          body="$RUNNER_TEMP/bardo-pr-body.md"
          cat > "$body" <<EOF
          ## BARDO candidate — human review required

          - Candidate: `$CANDIDATE_ID`
          - Base commit: `$BASE_SHA`
          - Candidate commit: `$candidate_sha`
          - Source branch: `$branch`

          ### Validation
          - Isolated candidate validation: SUCCESS
          - Repeated unit tests and debug APK compilation: SUCCESS
          - Changed paths were checked against BARDO's protected-path rules.
          - Existing tests, workflows, build configuration, signing data and Modo3 were not changed by this candidate.

          ### Governance
          This draft PR does not modify `main`, does not merge itself, and does not publish an APK. A human must review the diff and CI results and decide whether to merge it. The full signed APK workflow runs only after a separately authorised merge to `main`.
          EOF
          pr_url="$(gh pr create --draft --base main --head "$branch" --title "BARDO: candidate $CANDIDATE_ID" --body-file "$body")"
          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"

          # GITHUB_TOKEN-created PR events do not reliably start downstream workflows.
          # Dispatch the PR validation explicitly against the immutable candidate branch.
          gh workflow run bardo-validation.yml --ref "$branch"
          sleep 3
          validation_run_id="$(gh run list --workflow bardo-validation.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"

          {
            echo "Candidate branch: $branch"
            echo "Candidate commit: $candidate_sha"
            echo "Draft PR: $pr_url"
            echo "PR number: $pr_number"
            echo "PR validation run: ${validation_run_id:-pending}"
            echo "main was not modified."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Created draft PR #$pr_number: $pr_url"
          if [ -n "$validation_run_id" ] && [ "$validation_run_id" != "null" ]; then
            echo "PR validation: https://github.com/$GITHUB_REPOSITORY/actions/runs/$validation_run_id"
          else
            echo "PR created; validation dispatch accepted but run ID is not yet visible."
          fi
