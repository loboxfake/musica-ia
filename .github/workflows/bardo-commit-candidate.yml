name: DISABLED — legacy candidate branch and PR workflow

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

# BARDO now follows a single-branch policy. The historical implementation remains
# in Git history, but this workflow intentionally has no executable job.
jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    steps:
      - name: Explain main-only policy
        run: echo "Disabled: BARDO no longer creates bardo/* branches or pull requests."
