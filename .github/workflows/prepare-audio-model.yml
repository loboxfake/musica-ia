name: Prepare Stable Audio Open Small (on-device)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - bardo/integral-autonomy-20261109
    paths:
      - .github/workflows/prepare-audio-model.yml

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk || true
          df -h
          free -h

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ExecuTorch and Stable Audio export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir executorch==1.0.0
          python -m pip install --no-cache-dir --no-deps git+https://github.com/Stability-AI/stable-audio-tools.git@31932349d98c550c48711e7a5a40b24aa3d7c509
          python -m pip install --no-cache-dir \
            alias-free-torch==0.0.6 auraloss==0.4.0 descript-audio-codec==1.0.0 \
            einops einops-exts ema-pytorch==0.2.3 encodec huggingface_hub \
            importlib-resources==5.12.0 k-diffusion==0.1.1 laion-clap==1.1.4 \
            local-attention==1.8.6 pandas==2.0.2 prefigure==0.0.9 \
            pytorch_lightning==2.1.0 PyWavelets==1.4.1 safetensors \
            sentencepiece==0.1.99 torchmetrics==0.11.4 tqdm \
            "transformers<5" v-diffusion-pytorch==0.0.2 \
            vector-quantize-pytorch==1.14.41 webdataset==0.2.100
          python - <<'PY'
          import torch, torchaudio, executorch, torchao
          print("torch", torch.__version__)
          print("torchaudio", torchaudio.__version__)
          print("executorch", executorch.__file__)
          print("torchao", torchao.__version__)
          PY

      - name: Fetch pinned Arm export scripts
        run: |
          git clone https://github.com/Arm-Examples/ML-examples.git /tmp/arm-ml-examples
          git -C /tmp/arm-ml-examples checkout 0e453847ea28043194c32791a591d0f5a8a5ae2e
          mkdir -p /tmp/audio-export
          cp /tmp/arm-ml-examples/kleidiai-examples/audiogen-et/scripts/export_sao.py /tmp/audio-export/
          cp /tmp/arm-ml-examples/kleidiai-examples/audiogen-et/scripts/model.py /tmp/audio-export/
          sed -i '/^import logging$/a import os' /tmp/audio-export/model.py
          sed -i 's/from transformers import AutoTokenizer/from transformers import T5Tokenizer/' /tmp/audio-export/model.py
          sed -i 's/AutoTokenizer.from_pretrained("t5-base")/T5Tokenizer(vocab_file=os.environ["T5_SPIECE_MODEL"])/' /tmp/audio-export/model.py

      - name: Download and verify pinned model files
        env:
          AUDIO_MODEL_COMMIT: b9e923dea7584371999e965da8b22e57ef6935ef
          T5_COMMIT: 0610b4df8702a6a9c5c87bfc2e1fccdb05ca8de8
        run: |
          mkdir -p /tmp/audio-model /tmp/audio-export/models
          curl -fL --retry 3 --retry-all-errors \
            "https://huggingface.co/joeriben/stable-audio-open-small/resolve/${AUDIO_MODEL_COMMIT}/model.safetensors" \
            -o /tmp/audio-model/model.safetensors
          echo "0ee8b9edbe3104cb079dd163b62589d67d9c321ea8942cbbd81e6f7d3f390be2  /tmp/audio-model/model.safetensors" | sha256sum -c -
          curl -fL --retry 3 --retry-all-errors \
            "https://huggingface.co/joeriben/stable-audio-open-small/resolve/${AUDIO_MODEL_COMMIT}/model_config.json" \
            -o /tmp/audio-model/model_config.json
          curl -fL --retry 3 --retry-all-errors \
            "https://huggingface.co/google-t5/t5-base/resolve/${T5_COMMIT}/spiece.model" \
            -o /tmp/audio-export/models/spiece.model
          echo "d60acb128cf7b7f2536e8f38a5b18a05535c9e14c7a355904270e15b0945ea86  /tmp/audio-export/models/spiece.model" | sha256sum -c -
          curl -fL "https://huggingface.co/joeriben/stable-audio-open-small/resolve/${AUDIO_MODEL_COMMIT}/LICENSE" -o /tmp/audio-export/models/LICENSE
          cp /tmp/audio-model/model_config.json /tmp/audio-export/models/

      - name: Export the three ExecuTorch models
        working-directory: /tmp/audio-export
        env:
          T5_SPIECE_MODEL: /tmp/audio-export/models/spiece.model
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          python export_sao.py \
            --ckpt_path /tmp/audio-model/model.safetensors \
            --model_config /tmp/audio-model/model_config.json \
            --output_path /tmp/audio-export/models
          ls -lh /tmp/audio-export/models
          test -s /tmp/audio-export/models/conditioners_model.pte
          test -s /tmp/audio-export/models/dit_model.pte
          test -s /tmp/audio-export/models/autoencoder_model.pte

      - name: Upload on-device audio model pack
        uses: actions/upload-artifact@v4
        with:
          name: stable-audio-open-small-executorch
          path: /tmp/audio-export/models/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
