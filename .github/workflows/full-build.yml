name: Build full offline APK

# CI trigger refresh: keep the full offline build and audit as the release gate.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  full-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Mark full offline build pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: "pending", context: "BARDO / full offline APK audit", description: "Full offline model and native APK build queued" });
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Generate Digital Bardic Quill mipmaps
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/generate_launcher_mipmaps.py

      - name: Package BARDO source snapshot for its local developer core
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          git archive --format=zip --output="$RUNNER_TEMP/bardo-source-snapshot.zip" HEAD \
            app/src/main app/src/test app/build.gradle.kts build.gradle.kts settings.gradle.kts \
            gradle.properties gradle/wrapper .github/workflows
          test -s "$RUNNER_TEMP/bardo-source-snapshot.zip"
          cp "$RUNNER_TEMP/bardo-source-snapshot.zip" app/src/main/assets/bardo_source_snapshot.zip
          ls -lh app/src/main/assets/bardo_source_snapshot.zip

      - name: Download pinned local audio model pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow prepare-audio-model.yml --branch ruta-a-compile --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful Stable Audio model export run found."
            exit 1
          fi
          echo "Using model export run: $run_id"
          mkdir -p app/src/main/assets/audio_model
          gh run download "$run_id" --name stable-audio-open-small-executorch --dir app/src/main/assets/audio_model
          ls -lh app/src/main/assets/audio_model
          test -s app/src/main/assets/audio_model/conditioners_model.pte
          test -s app/src/main/assets/audio_model/dit_model.pte
          test -s app/src/main/assets/audio_model/autoencoder_model.pte
          test -s app/src/main/assets/audio_model/spiece.model
          test -s app/src/main/assets/audio_model/LICENSE
          test -s app/src/main/assets/NOTICE.txt
          grep -qi "Powered by Stability AI" README.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android CMake and NDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
          cache-disabled: true

      - name: Run unit tests
        run: |
          gradle testDebugUnitTest 2>&1 | tee full-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "FAILED|Exception|error:" full-tests.log || true
            exit 1
          fi

      - name: Install pinned PyTorch headers for ExecuTorch CMake
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.0
          python3 -c "import torch; print('PyTorch', torch.__version__, torch.__file__)"
      - name: Checkout pinned ExecuTorch source
        run: |
          git clone --no-checkout https://github.com/pytorch/executorch.git "$RUNNER_TEMP/executorch"
          git -C "$RUNNER_TEMP/executorch" checkout 8c84780911e7f4e9eb19395181b04761392a4b56
          git -C "$RUNNER_TEMP/executorch" submodule update --init --recursive --jobs 6 \
            backends/xnnpack/third-party/FP16 \
            backends/xnnpack/third-party/FXdiv \
            backends/xnnpack/third-party/XNNPACK \
            backends/xnnpack/third-party/cpuinfo \
            backends/xnnpack/third-party/pthreadpool \
            extension/llm/tokenizers \
            kernels/optimized/third-party/eigen \
            third-party/flatbuffers \
            third-party/flatcc \
            third-party/gflags \
            third-party/json \
            third-party/pocketfft
          test "$(git -C "$RUNNER_TEMP/executorch" rev-parse HEAD)" = "8c84780911e7f4e9eb19395181b04761392a4b56"

      - name: Build full APK with on-device audio model
        run: |
          gradle assembleDebug -PwithAudioNative=true -PbardoVersionCode="$((1000 + GITHUB_RUN_NUMBER))" -PetSrcPath="$RUNNER_TEMP/executorch" 2>&1 | tee full-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|CMake Error|FAILED|What went wrong" full-build.log | tail -100 || true
            exit 1
          fi

      - name: Audit APK contents and integrity
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          python3 - "$apk" <<'PY'
          import hashlib, pathlib, sys, zipfile
          apk = pathlib.Path(sys.argv[1])
          required = [
              "assets/audio_model/conditioners_model.pte",
              "assets/audio_model/dit_model.pte",
              "assets/audio_model/autoencoder_model.pte",
              "assets/audio_model/spiece.model",
              "assets/audio_model/LICENSE",
              "assets/NOTICE.txt",
              "res/mipmap-mdpi-v4/ic_launcher.webp",
              "res/mipmap-hdpi-v4/ic_launcher.webp",
              "res/mipmap-xhdpi-v4/ic_launcher.webp",
              "res/mipmap-xxhdpi-v4/ic_launcher.webp",
              "res/mipmap-xxxhdpi-v4/ic_launcher.webp",
              "res/mipmap-mdpi-v4/ic_launcher_foreground.webp",
              "res/mipmap-hdpi-v4/ic_launcher_foreground.webp",
              "res/mipmap-xhdpi-v4/ic_launcher_foreground.webp",
              "res/mipmap-xxhdpi-v4/ic_launcher_foreground.webp",
              "res/mipmap-xxxhdpi-v4/ic_launcher_foreground.webp",
              "res/mipmap-anydpi-v26/ic_launcher.xml",
              "res/mipmap-anydpi-v26/ic_launcher_round.xml",
              "lib/arm64-v8a/libaudiogen.so",
              "lib/arm64-v8a/libmp3encoder.so",
              "lib/arm64-v8a/libmp3lame.so",
          ]
          report = [f"APK: {apk.name}", f"APK_BYTES: {apk.stat().st_size}"]
          digest = hashlib.sha256()
          with apk.open("rb") as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          report.append(f"APK_SHA256: {digest.hexdigest()}")
          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP_CORRUPT_ENTRY: {bad}")
              names = set(z.namelist())
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("MISSING_APK_ENTRIES: " + ", ".join(missing))
              for name in required:
                  info = z.getinfo(name)
                  if info.file_size <= 0:
                      raise SystemExit(f"EMPTY_APK_ENTRY: {name}")
                  report.append(f"ENTRY_OK: {name} ({info.file_size} bytes)")
          pathlib.Path("full-apk-audit.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$apk" | tee -a full-apk-audit.txt
          grep -q "package: name='com.musicaia'" full-apk-audit.txt
          grep -q "sdkVersion:'26'" full-apk-audit.txt

      - name: Audit APK for embedded credentials and signing material
        run: |
          set -euo pipefail
          python3 tools/audit_apk_secrets.py "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"

      - name: Report full offline APK audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = "${{ job.status }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "BARDO / full offline APK audit",
              description: state === "success" ? "Unit tests, native build and APK audit passed" : "Full offline build or APK audit failed"
            });

      - name: Publish audited APK as a private GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -s "$apk"
          tag="bardo-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$apk" full-apk-audit.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BARDO · APK offline completa #${GITHUB_RUN_NUMBER}" \
            --notes "Powered by Stability AI. Incluye Stable Audio Open Small bajo los términos de su licencia distribuida en assets/audio_model/LICENSE; NOTICE incluido dentro de la APK. Auditoría incluida como asset. La publicación confirma compilación y empaquetado, no sustituye la prueba real en el Xiaomi 11T Pro." \
            --prerelease

      - name: Report full offline APK release status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = "${{ steps.publish.outcome }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "BARDO / full offline APK release",
              description: state === "success" ? "Audited APK published to GitHub Releases" : "Audited APK release was not published"
            });

