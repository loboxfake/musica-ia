name: Build full offline APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
          cache-disabled: true
      - name: Generate launcher assets
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/generate_launcher_mipmaps.py
      - name: Full offline build
        run: |
          test -n "${EXECUTORCH_SRC:-}"
          test -s app/src/main/assets/audio_model/conditioners_model.pte
          test -s app/src/main/assets/audio_model/dit_model.pte
          test -s app/src/main/assets/audio_model/autoencoder_model.pte
          test -s app/src/main/assets/audio_model/spiece.model
          test -s app/src/main/assets/audio_model/LICENSE
          ./gradlew --no-daemon testDebugUnitTest assembleDebug -PwithAudioNative=true -PetSrcPath="$EXECUTORCH_SRC"
