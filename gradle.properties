# La APK offline integra modelos .pte de varios GB. La compresion de assets de Release
# supero el heap de 2 GiB en GitHub Actions (Gradle :app:compressReleaseAssets).
# Reservamos un heap mayor y limitamos workers para evitar picos de memoria concurrentes.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Align Android Lint with Kotlin 2.2.x; fixes the Lifecycle detector binary mismatch in AGP 8.7.
android.experimental.lint.version=8.8.2
